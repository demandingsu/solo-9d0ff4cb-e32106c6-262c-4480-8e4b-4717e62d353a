<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>环境监测小时观测数据平台</title>
<style>
:root { --line:#d8dee4; --bg:#f6f8fa; --ok:#1a7f37; --bad:#cf222e; --ink:#1f2328; --brand:#0b3d66; }
* { box-sizing: border-box; }
body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; margin:0; color:var(--ink); background:var(--bg); }
header { background:var(--brand); color:#fff; padding:14px 22px; }
header h1 { margin:0; font-size:19px; }
header p { margin:4px 0 0; font-size:12px; opacity:.85; }
main { max-width:1080px; margin:18px auto; padding:0 16px 40px; }
section { background:#fff; border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:16px; }
h2 { font-size:15px; margin:0 0 10px; }
table { border-collapse:collapse; width:100%; font-size:13px; margin:6px 0; }
th,td { border:1px solid var(--line); padding:5px 8px; text-align:left; }
th { background:var(--bg); }
button { background:var(--brand); color:#fff; border:0; border-radius:6px; padding:6px 14px; cursor:pointer; font-size:13px; }
button.ghost { background:#fff; color:var(--brand); border:1px solid var(--brand); padding:3px 10px; }
button:hover { opacity:.88; }
input,select { padding:5px 7px; border:1px solid var(--line); border-radius:6px; font-size:13px; }
.badge { display:inline-block; background:var(--ok); color:#fff; font-size:11px; border-radius:10px; padding:1px 8px; margin-left:6px; vertical-align:middle; }
.badge.old { background:#6e7781; }
.ok { color:var(--ok); } .err { color:var(--bad); }
.msg { margin-top:8px; font-size:13px; }
.err-list { color:var(--bad); font-size:12px; margin:4px 0 0; }
.muted { color:#57606a; font-size:12px; }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:6px 0; }
code { background:var(--bg); padding:1px 5px; border-radius:4px; }
details { margin:2px 0 10px; }
summary { cursor:pointer; }
.nullcell { color:#9a6700; font-size:12px; }
th.calc, td.calc { background:#f0f7ff; }
.badcell { color:var(--bad); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>环境监测小时观测数据平台</h1>
  <p>结构版本化：改名 / 新增可空列 / 整数扩小数 可追溯；旧批次保留原值与原结构；删除列、合并列、缩型一律拒绝；失败操作不影响供数。计算列按稳定列标识取数、口径可版本化，旧口径可整链复算。</p>
</header>
<main>

<section id="sec-current">
  <h2>① 现役结构</h2>
  <div id="current-box">加载中…</div>
</section>

<section id="sec-publish">
  <h2>② 发布结构版本</h2>
  <div id="publish-box"></div>
</section>

<section id="sec-computed">
  <h2>③ 计算列与口径</h2>
  <p class="muted">每列只做一次加、减、乘或除；左右操作数可为常量、原始列（按稳定标识取数，
    原始列改名 / 扩型后公式不变）或计算列。发布新口径时，直接或间接引用它的计算列会自动升版，
    无关计算列沿用原口径。引用无效或成环会整批拒绝。</p>
  <div id="computed-publish"></div>
  <div class="msg" id="computed-msg"></div>
  <div id="computed-list"></div>
</section>

<section id="sec-upload">
  <h2>④ 上传观测 CSV</h2>
  <p class="muted" id="csv-hint"></p>
  <div class="row">
    <input type="file" id="csv-file" accept=".csv,text/csv">
    <button onclick="uploadCsv()">上传</button>
  </div>
  <div id="upload-result" class="msg"></div>
</section>

<section id="sec-query">
  <h2>⑤ 查询观测与计算结果</h2>
  <div class="row">
    <label>站号 <input id="q-station" placeholder="如 S01（可空）"></label>
    <label>起始 <input id="q-from" placeholder="2026-11-18T00:00"></label>
    <label>截止 <input id="q-to" placeholder="2026-11-18T23:00"></label>
    <label>批次视角 <select id="q-version"></select></label>
    <label>计算口径 <select id="q-def-version"></select></label>
    <button onclick="doQuery()">查询</button>
  </div>
  <div class="row" id="q-computed-wrap">
    <span class="muted">计算列：</span><span id="q-computed"></span>
  </div>
  <div class="muted" id="q-def-hint"></div>
  <div id="query-result"></div>
</section>

<section id="sec-versions">
  <h2>⑥ 版本历史</h2>
  <div id="versions-box"></div>
</section>

<section id="sec-batches">
  <h2>⑦ 批次列表</h2>
  <div id="batches-box"></div>
</section>

</main>
<script>
const $ = id => document.getElementById(id);
const state = { current: null, versions: [], batches: [], computed: [] };
const TYPE_LABEL = { station:'站号(系统)', hour:'UTC小时(系统)', integer:'整数', float:'小数', text:'文本' };

async function api(path, opts){
  const r = await fetch(path, opts);
  let body = null;
  try { body = await r.json(); } catch(e) {}
  if(!r.ok){
    throw { status:r.status, message:(body && body.detail) || ('HTTP ' + r.status), errors:(body && body.errors) || [] };
  }
  return body;
}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = v => (v === null || v === undefined) ? '<span class="nullcell">（空）</span>' : esc(v);
function showErr(el, e){
  el.innerHTML = '<div class="err">✗ ' + esc(e.message) + '</div>' +
    ((e.errors && e.errors.length) ? '<ul class="err-list">' + e.errors.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>' : '');
}

async function refresh(){
  try { state.current = await api('/api/versions/current'); } catch(e) { state.current = null; }
  state.versions = (await api('/api/versions')).versions;
  state.batches = (await api('/api/batches')).batches;
  state.computed = (await api('/api/computed-columns')).computed_columns;
  renderCurrent(); renderPublish(); renderComputed(); renderVersions(); renderBatches();
  renderLensOptions(); renderComputedPicker();
}

function colTable(cols){
  return '<table><tr><th>#</th><th>列名</th><th>类型</th><th>可空</th><th>列标识</th></tr>' +
    cols.map(c => '<tr><td>' + (c.position + 1) + '</td><td>' + esc(c.name) + '</td><td>' + TYPE_LABEL[c.type] +
      '</td><td>' + (c.nullable ? '是' : '否') + '</td><td><code>' + esc(c.column_id) + '</code></td></tr>').join('') +
    '</table>';
}

function renderCurrent(){
  const box = $('current-box');
  if(!state.current){
    box.innerHTML = '<p class="muted">尚未发布任何结构版本，请先在「②」发布初版结构。</p>';
    $('csv-hint').textContent = '';
    return;
  }
  const v = state.current;
  const cp = v.computed_columns || [];
  box.innerHTML = '<p>现役版本 <b>v' + v.version_no + '</b><span class="badge">active</span> ' +
    '<span class="muted">' + esc(v.created_at) + (v.note ? ' · ' + esc(v.note) : '') + '</span></p>' + colTable(v.columns) +
    (cp.length ? '<p class="muted">本版计算列口径：' + cp.map(c =>
      esc(c.name) + ' <code>' + esc(c.formula) + '</code>（口径 ' + esc(c.computed_id) + '/第' + c.def_no + '版）').join('；') + '</p>' : '');
  $('csv-hint').textContent = 'CSV 表头须与现役结构一致（顺序不限，计算列不入 CSV）：' + v.columns.map(c => c.name).join(', ');
}

/* ---------- 发布原始列 ---------- */

function renderPublish(){
  const box = $('publish-box');
  if(!state.current){
    box.innerHTML =
      '<p class="muted">初版结构必须包含 1 个站号列与 1 个 UTC 小时列（名称自定），数据列类型可选 整数 / 小数 / 文本。</p>' +
      '<div class="row"><label>站号列名 <input id="p-station" value="站号"></label>' +
      '<label>UTC小时列名 <input id="p-hour" value="UTC小时"></label></div>' +
      '<div id="p-rows"></div>' +
      '<div class="row"><button class="ghost" onclick="addInitRow()">+ 添加数据列</button></div>' +
      '<div class="row"><label>备注 <input id="p-note" placeholder="可选"></label>' +
      '<button onclick="publishInitial()">发布初版结构</button></div>' +
      '<div id="publish-msg" class="msg"></div>';
    addInitRow();
    return;
  }
  const v = state.current;
  box.innerHTML =
    '<p class="muted">基于现役 v' + v.version_no + ' 演化：直接改「新列名」即改名；整数列可扩为小数；可追加可空新列。' +
    '删除列、合并列、缩型（小数→整数等）会被拒绝。</p>' +
    '<table id="p-table"><tr><th>来源列标识</th><th>原列名</th><th>新列名</th><th>类型</th><th></th></tr>' +
    v.columns.map(carriedRowHtml).join('') + '</table>' +
    '<div class="row"><button class="ghost" onclick="addNewRow()">+ 新增可空列</button>' +
    '<label>备注 <input id="p-note" placeholder="可选"></label>' +
    '<button onclick="publishEvolution()">发布新版本 v' + (v.version_no + 1) + '</button></div>' +
    '<div id="publish-msg" class="msg"></div>';
}

function carriedRowHtml(c){
  let typeCell;
  if(c.type === 'station' || c.type === 'hour') typeCell = '<span class="muted">' + TYPE_LABEL[c.type] + '</span>';
  else if(c.type === 'integer') typeCell = '<select data-type><option value="integer" selected>整数</option><option value="float">小数（扩型）</option></select>';
  else if(c.type === 'float') typeCell = '<select data-type><option value="float" selected>小数</option></select>';
  else typeCell = '<select data-type><option value="text" selected>文本</option></select>';
  return '<tr data-source="' + esc(c.column_id) + '"><td><code>' + esc(c.column_id) + '</code></td><td>' + esc(c.name) + '</td>' +
    '<td><input data-name value="' + esc(c.name) + '"></td><td>' + typeCell + '</td><td class="muted">沿用</td></tr>';
}

function addNewRow(){
  const tr = document.createElement('tr');
  tr.setAttribute('data-source', '');
  tr.innerHTML = '<td class="muted">（新列）</td><td class="muted">—</td>' +
    '<td><input data-name placeholder="新列名"></td>' +
    '<td><select data-type><option value="integer">整数</option><option value="float">小数</option><option value="text">文本</option></select></td>' +
    '<td><button class="ghost" onclick="this.closest(\'tr\').remove()">移除</button></td>';
  $('p-table').appendChild(tr);
}

function addInitRow(){
  const div = document.createElement('div');
  div.className = 'row';
  div.innerHTML = '<input data-name placeholder="数据列名，如 气温">' +
    '<select data-type><option value="integer">整数</option><option value="float">小数</option><option value="text">文本</option></select>' +
    '<button class="ghost" onclick="this.parentElement.remove()">移除</button>';
  $('p-rows').appendChild(div);
}

async function publishInitial(){
  const msg = $('publish-msg'); msg.innerHTML = '';
  const cols = [
    { role:'station', name: $('p-station').value.trim() },
    { role:'hour', name: $('p-hour').value.trim() },
  ];
  document.querySelectorAll('#p-rows .row').forEach(r => {
    cols.push({ role:'data', name: r.querySelector('[data-name]').value.trim(), type: r.querySelector('[data-type]').value });
  });
  try{
    await api('/api/versions', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ note: $('p-note').value.trim(), columns: cols }) });
    await refresh();
    $('publish-msg') && ($('publish-msg').innerHTML = '<div class="ok">✓ 初版结构已发布</div>');
  }catch(e){ showErr(msg, e); }
}

async function publishEvolution(){
  const msg = $('publish-msg'); msg.innerHTML = '';
  const cols = [];
  document.querySelectorAll('#p-table tr[data-source]').forEach(tr => {
    const source = tr.getAttribute('data-source') || null;
    const c = { source, name: tr.querySelector('[data-name]').value.trim() };
    const tsel = tr.querySelector('[data-type]');
    if(tsel) c.type = tsel.value;
    if(!source) c.nullable = true;
    cols.push(c);
  });
  try{
    await api('/api/versions', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ note: $('p-note').value.trim(), columns: cols }) });
    await refresh();
    $('publish-msg') && ($('publish-msg').innerHTML = '<div class="ok">✓ 新版本已发布并成为现役版本</div>');
  }catch(e){ showErr(msg, e); }
}

/* ---------- 计算列发布 ---------- */

function operandOptions(selected){
  selected = selected || '';
  const v = state.current;
  const raw = v ? v.columns.filter(c => c.type !== 'station' && c.type !== 'hour' && c.type !== 'text') : [];
  const opt = (val, label) => '<option value="' + esc(val) + '"' + (val === selected ? ' selected' : '') + '>' + esc(label) + '</option>';
  let h = '<optgroup label="原始列">' + raw.map(c =>
    opt('column:' + c.column_id, c.name + '（' + c.column_id + '）')).join('') + '</optgroup>';
  const comp = state.computed.filter(c => c.current_def);
  if(comp.length){
    h += '<optgroup label="计算列（现役口径）">' + comp.map(c =>
      opt('computed:' + c.computed_id, c.name + '（' + c.computed_id + '）')).join('') + '</optgroup>';
  }
  return h;
}

function addComputedRow(){
  const tr = document.createElement('tr');
  tr.setAttribute('data-cnew', '1');
  tr.innerHTML = '<td><input data-name placeholder="计算列名，如 温压比"></td>' +
    '<td><select data-left><option value="const">常量</option>' + operandOptions() + '</select></td>' +
    '<td class="muted">—</td>' +
    '<td><input data-leftval type="number" step="any" value="1"></td>' +
    '<td><select data-op><option>+</option><option>-</option><option>*</option><option>/</option></select></td>' +
    '<td><select data-right><option value="const">常量</option>' + operandOptions() + '</select></td>' +
    '<td><input data-rightval type="number" step="any" value="0"></td>' +
    '<td><button class="ghost" onclick="this.closest(\'tr\').remove()">移除</button></td>';
  $('c-table').appendChild(tr);
  bindOperandRow(tr);
}

function newComputedRow(){
  return '<tr data-cnew="1"><td><input data-name placeholder="计算列名"></td>' +
    '<td><select data-left><option value="const">常量</option>' + operandOptions() + '</select></td>' +
    '<td class="muted">—</td><td><input data-leftval type="number" step="any" value="1"></td>' +
    '<td><select data-op><option>+</option><option>-</option><option>*</option><option>/</option></select></td>' +
    '<td><select data-right><option value="const">常量</option>' + operandOptions() + '</select></td>' +
    '<td><input data-rightval type="number" step="any" value="0"></td>' +
    '<td><button class="ghost" onclick="this.closest(\'tr\').remove()">移除</button></td></tr>';
}

function bindOperandRow(tr){
  [['data-left','data-leftval'],['data-right','data-rightval']].forEach(([s,v]) => {
    const sel = tr.querySelector('[' + s + ']');
    const val = tr.querySelector('[' + v + ']');
    const sync = () => {
      const isConst = sel.value === 'const';
      val.style.display = isConst ? '' : 'none';
    };
    if(sel && val){ sel.addEventListener('change', sync); sync(); }
  });
}

function renderComputed(){
  const box = $('computed-publish');
  if(!state.current){
    box.innerHTML = '<p class="muted">先发布初版结构，再定义计算列。</p>';
    $('computed-list').innerHTML = '';
    return;
  }
  const v = state.current;
  const rows = (v.computed_columns || []).map(c => {
    const lref = c.left.kind === 'const' ? 'const' : c.left.kind + ':' + c.left.ref;
    const rref = c.right.kind === 'const' ? 'const' : c.right.kind + ':' + c.right.ref;
    return '<tr data-cid="' + esc(c.computed_id) + '">' +
      '<td><code>' + esc(c.computed_id) + '</code><br><span class="muted">现口径第' + c.def_no + '版</span></td>' +
      '<td>' + esc(c.name) + '</td>' +
      '<td><select data-left><option value="const"' + (c.left.kind === 'const' ? ' selected' : '') + '>常量</option>' +
        operandOptions(lref) + '</select></td>' +
      '<td>' + (c.left.kind === 'const' ? '<input data-leftval type="number" step="any" value="' + esc(c.left.value) + '">' : '<span class="muted">—</span>') + '</td>' +
      '<td><select data-op>' + ['+','-','*','/'].map(o => '<option' + (o === c.op ? ' selected' : '') + '>' + o + '</option>').join('') + '</select></td>' +
      '<td><select data-right><option value="const"' + (c.right.kind === 'const' ? ' selected' : '') + '>常量</option>' +
        operandOptions(rref) + '</select></td>' +
      '<td>' + (c.right.kind === 'const' ? '<input data-rightval type="number" step="any" value="' + esc(c.right.value) + '">' : '<span class="muted">—</span>') + '</td>' +
      '<td><span class="muted">不改口径则不要勾选</span><br><label class="muted"><input type="checkbox" data-bump> 发布新口径</label></td>' +
      '</tr>';
  }).join('');

  box.innerHTML =
    '<p class="muted">现役 v' + v.version_no + ' 的计算列。勾选「发布新口径」并调整公式即为其升版；' +
    '直接或间接引用它的计算列会自动升版，无关列沿用原口径。</p>' +
    '<table id="c-table"><tr><th>标识</th><th>名称</th><th>左操作数</th><th>左常量</th><th>运算</th>' +
    '<th>右操作数</th><th>右常量</th><th>操作</th></tr>' + rows + '</table>' +
    '<div class="row"><button class="ghost" onclick="addComputedRow()">+ 新增计算列</button>' +
    '<label>备注 <input id="c-note" placeholder="可选"></label>' +
    '<button onclick="publishComputed()">发布计算列口径（同时生成新版本 v' + (v.version_no + 1) + '）</button></div>';

  document.querySelectorAll('#c-table tr[data-cid]').forEach(bindOperandRow);
  document.querySelectorAll('#c-table tr[data-cnew]').forEach(bindOperandRow);

  let h = '';
  state.computed.forEach(c => {
    h += '<p><b>' + esc(c.name) + '</b> <code>' + esc(c.computed_id) + '</code> ' +
      '<span class="muted">现口径：' + esc(c.formula) + '</span></p>' +
      '<details><summary class="muted">口径历史（' + c.definitions.length + ' 版）</summary><ul class="muted">' +
      c.definitions.map(d => '<li>第' + d.def_no + '版（随 v' + d.created_version_no + ' 发布）：<code>' +
        esc(d.formula) + '</code></li>').join('') + '</ul></details>';
  });
  $('computed-list').innerHTML = h || '<p class="muted">暂无计算列。</p>';
}

function operandFrom(kindSel, valInput){
  const v = kindSel.value;
  if(v === 'const') return { kind:'const', value:Number(valInput.value) };
  const [kind, ref] = v.split(':');
  return { kind, ref };
}

async function publishComputed(){
  const msg = $('computed-msg'); msg.innerHTML = '';
  if(!state.current){ showErr(msg, { message:'请先发布初版结构' }); return; }
  const specs = [];
  let bad = false;
  document.querySelectorAll('#c-table tr[data-cid]').forEach(tr => {
    const bump = tr.querySelector('[data-bump]');
    if(!bump || !bump.checked) return;
    const cid = tr.getAttribute('data-cid');
    const leftSel = tr.querySelector('[data-left]');
    const rightSel = tr.querySelector('[data-right]');
    specs.push({
      column_id: cid,
      op: tr.querySelector('[data-op]').value,
      left: operandFrom(leftSel, tr.querySelector('[data-leftval]')),
      right: operandFrom(rightSel, tr.querySelector('[data-rightval]')),
    });
  });
  document.querySelectorAll('#c-table tr[data-cnew]').forEach(tr => {
    const name = tr.querySelector('[data-name]').value.trim();
    if(!name){ bad = true; return; }
    specs.push({
      name,
      op: tr.querySelector('[data-op]').value,
      left: operandFrom(tr.querySelector('[data-left]'), tr.querySelector('[data-leftval]')),
      right: operandFrom(tr.querySelector('[data-right]'), tr.querySelector('[data-rightval]')),
    });
  });
  if(bad){ showErr(msg, { message:'新增计算列必须填写名称' }); return; }
  if(!specs.length){ showErr(msg, { message:'没有要发布的内容：请勾选升版口径或新增计算列' }); return; }

  // 沿用原始列映射（保持不变），计算列不带 columns 以外的改动
  const cols = state.current.columns.map(c => ({ source: c.column_id, name: c.name, type: c.type }));
  try{
    const r = await api('/api/versions', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ note: ($('c-note') && $('c-note').value.trim()) || '计算列口径变更',
        columns: cols, computed_columns: specs }) });
    await refresh();
    const bumped = (r.computed_columns || []).map(c => c.name + '（第' + c.def_no + '版）').join('、');
    $('computed-msg').innerHTML = '<div class="ok">✓ 已发布 v' + r.version_no + '，当前计算列口径：' + esc(bumped) + '</div>';
  }catch(e){ showErr(msg, e); }
}

/* ---------- 上传 ---------- */

async function uploadCsv(){
  const msg = $('upload-result'); msg.innerHTML = '';
  const f = $('csv-file').files[0];
  if(!f){ msg.innerHTML = '<div class="err">请选择 CSV 文件</div>'; return; }
  const fd = new FormData(); fd.append('file', f);
  try{
    const r = await api('/api/batches', { method:'POST', body: fd });
    msg.innerHTML = '<div class="ok">✓ 批次 #' + r.batch_id + ' 已按 v' + r.version_no + ' 入库，共 ' + r.row_count + ' 行</div>';
    await refresh();
  }catch(e){ showErr(msg, e); }
}

/* ---------- 查询 ---------- */

function renderLensOptions(){
  const sel = $('q-version');
  const cur = sel.value;
  let opts = '<option value="">现役版本（统一展示全部批次）</option>';
  state.versions.forEach(v => {
    opts += '<option value="' + v.version_no + '">历史视角 v' + v.version_no + '（仅该版批次 · 当时列名与原值）</option>';
  });
  sel.innerHTML = opts;
  if([...sel.options].some(o => o.value === cur)) sel.value = cur;
  sel.onchange = () => doQuery();

  const dsel = $('q-def-version');
  const dcur = dsel.value;
  let dopts = '<option value="">跟随批次视角（现役时用现役口径）</option>';
  state.versions.forEach(v => {
    const n = (v.computed_columns || []).length;
    dopts += '<option value="' + v.version_no + '">口径 v' + v.version_no + '（' + n + ' 个计算列 · ' +
      (v.status === 'active' ? '现役' : '历史') + '）</option>';
  });
  dsel.innerHTML = dopts;
  if([...dsel.options].some(o => o.value === dcur)) dsel.value = dcur;
  dsel.onchange = () => { renderComputedPicker(); doQuery(); };
}

function renderComputedPicker(){
  // 选择器要跟随“计算口径”版本：历史口径里的计算列集合可能不同
  const defNo = $('q-def-version').value;
  const ver = defNo
    ? state.versions.find(v => String(v.version_no) === defNo)
    : state.current;
  const cols = (ver && ver.computed_columns) || [];
  const box = $('q-computed');
  if(!cols.length){
    box.innerHTML = '<span class="muted">（该口径暂无计算列）</span>';
    return;
  }
  // 已存在的勾选状态优先；首次渲染（无任何输入框）默认全选
  const existing = [...box.querySelectorAll('input')];
  const prev = new Set(existing.filter(x => x.checked).map(x => x.value));
  box.innerHTML = cols.map(c =>
    '<label style="margin-right:12px"><input type="checkbox" value="' + esc(c.computed_id) + '"' +
    (existing.length === 0 || prev.has(c.computed_id) ? ' checked' : '') + '> ' + esc(c.name) + '</label>').join('');
  box.querySelectorAll('input').forEach(x => x.addEventListener('change', () => doQuery()));
}

async function doQuery(){
  const box = $('query-result'); box.innerHTML = '';
  const p = new URLSearchParams();
  if($('q-station').value.trim()) p.set('station', $('q-station').value.trim());
  if($('q-from').value.trim()) p.set('hour_from', $('q-from').value.trim());
  if($('q-to').value.trim()) p.set('hour_to', $('q-to').value.trim());
  if($('q-version').value) p.set('version_no', $('q-version').value);
  if($('q-def-version').value) p.set('def_version_no', $('q-def-version').value);
  const picked = [...document.querySelectorAll('#q-computed input:checked')].map(x => x.value);
  if(picked.length) p.set('computed_ids', picked.join(','));
  try{
    const d = await api('/api/observations?' + p.toString());
    const cols = d.version.columns;
    const comp = d.computed_columns || [];
    let h = '<p class="muted">批次视角：v' + d.version.version_no + '（' + (d.version.status === 'active' ? '现役' : '历史') +
      '）· 计算口径：v' + d.def_version.version_no + ' · 共 ' + d.row_count + ' 行' +
      (d.truncated ? '（已达上限，结果截断）' : '') + '</p>';
    if(comp.length){
      h += '<p class="muted">计算列：' + comp.map(c => esc(c.name) + ' <code>' + esc(c.formula) +
        '</code>（第' + c.def_no + '版，随 v' + c.def_version_no + '）').join('；') + '</p>';
    }
    if(!d.rows.length){ box.innerHTML = h + '<p class="muted">无匹配数据。</p>'; return; }
    h += '<table><tr><th>批次</th><th>批次版本</th>' +
      cols.map(c => '<th>' + esc(c.name) + '<br><span class="muted">' + TYPE_LABEL[c.type] + '</span></th>').join('') +
      comp.map(c => '<th class="calc">' + esc(c.name) + '<br><span class="muted">计算 · ' + esc(c.computed_id) + '</span></th>').join('') +
      '</tr>';
    d.rows.forEach(r => {
      h += '<tr><td>#' + r.batch_id + '<br><span class="muted">' + esc(r.batch_filename) + '</span></td>' +
        '<td>v' + r.batch_version_no + '</td>' +
        cols.map(c => '<td>' + fmt(r.values[c.name]) + '</td>').join('') +
        comp.map(c => {
          const x = r.computed[c.computed_id];
          if(!x) return '<td class="muted">—</td>';
          if(x.value === null || x.value === undefined){
            return '<td class="badcell">—<br><span class="err">' + esc(x.reason || '缺值') + '</span></td>';
          }
          return '<td class="calc"><b>' + esc(x.value) + '</b><details><summary class="muted">依赖</summary>' +
            '<div class="muted">口径：第' + x.def_no + '版（随 v' + x.def_version_no + '）<br>' +
            '来源原始列：' + (x.source_columns.map(s => esc(s)).join('、') || '无') + '<br>依赖链：' +
            x.chain.map(s => esc(s.name) + '=' + (s.value === null ? '（空：' + esc(s.reason || '') + '）' : esc(s.value)) +
              '（第' + s.def_no + '版/v' + s.def_version_no + '）').join(' → ') +
            '</div></details></td>';
        }).join('') + '</tr>';
    });
    box.innerHTML = h + '</table>';
  }catch(e){ showErr(box, e); }
}

/* ---------- 版本历史 / 批次 ---------- */

function renderVersions(){
  const box = $('versions-box');
  if(!state.versions.length){ box.innerHTML = '<p class="muted">暂无版本。</p>'; return; }
  let h = '';
  [...state.versions].reverse().forEach(v => {
    const cp = v.computed_columns || [];
    h += '<p><b>v' + v.version_no + '</b>' +
      (v.status === 'active' ? '<span class="badge">active</span>' : '<span class="badge old">已替换</span>') +
      ' <span class="muted">' + esc(v.created_at) + (v.note ? ' · ' + esc(v.note) : '') + '</span> ' +
      '<button class="ghost" onclick="lensTo(' + v.version_no + ')">以此视角查询</button> ' +
      '<button class="ghost" onclick="defTo(' + v.version_no + ')">以此口径复算</button></p>' +
      '<details><summary class="muted">列结构（' + v.columns.length + ' 列）</summary>' + colTable(v.columns) + '</details>' +
      (cp.length ? '<details><summary class="muted">计算列口径（' + cp.length + ' 个）</summary><ul class="muted">' +
        cp.map(c => '<li>' + esc(c.name) + ' <code>' + esc(c.computed_id) + '</code>：<code>' + esc(c.formula) +
          '</code>（口径第' + c.def_no + '版，随 v' + c.created_version_no + '）</li>').join('') + '</ul></details>' : '');
  });
  box.innerHTML = h;
}
function lensTo(v){
  $('q-version').value = String(v);
  $('q-def-version').value = '';
  renderComputedPicker();
  document.getElementById('sec-query').scrollIntoView({behavior:'smooth'});
  doQuery();
}
function defTo(v){
  $('q-def-version').value = String(v);
  renderComputedPicker();
  document.getElementById('sec-query').scrollIntoView({behavior:'smooth'});
  doQuery();
}

function renderBatches(){
  const box = $('batches-box');
  if(!state.batches.length){ box.innerHTML = '<p class="muted">暂无批次。</p>'; return; }
  let h = '<table><tr><th>批次</th><th>结构版本</th><th>文件名</th><th>行数</th><th>上传时间</th></tr>';
  state.batches.forEach(b => {
    h += '<tr><td>#' + b.id + '</td><td>v' + b.version_no + '</td><td>' + esc(b.filename) +
      '</td><td>' + b.row_count + '</td><td>' + esc(b.uploaded_at) + '</td></tr>';
  });
  box.innerHTML = h + '</table>';
}

refresh().then(() => { if(state.current) doQuery(); })
  .catch(e => { $('current-box').innerHTML = '<div class="err">加载失败：' + esc(e.message || e) + '</div>'; });
</script>
</body>
</html>
